name: Z80 replacement prototype validation
on:
  push:
    branches: [main, feature/cpm-wifi-modem, feature/cpm85-drive-control, feature/cpm85-management-console]
  workflow_dispatch:
jobs:
  native:
    name: Native Z80/bridge regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run host CPU tests
        run: |
          bash tests/run_z80_core_native.sh
          python3 tests/check_web_ui_cleanup.py
          node tests/web_terminal_browser_native.js
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pedantic tests/console_ansi_probe_native.cpp -o /tmp/console_ansi_probe_test
          /tmp/console_ansi_probe_test
          python3 tests/check_tft_bringuptest.py
          python3 tests/check_cpm85_bridge.py
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pedantic tests/cpm85_keymap_native.cpp -o /tmp/cpm85_keymap_test
          /tmp/cpm85_keymap_test
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pedantic tests/modem_uart_native.cpp -o /tmp/modem_uart_test
          /tmp/modem_uart_test
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pedantic tests/modem_hayes_native.cpp -o /tmp/modem_hayes_test
          /tmp/modem_hayes_test
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pedantic tests/spi_cache_words_native.cpp -o /tmp/spi_cache_words_test
          /tmp/spi_cache_words_test
          python3 tools/build_modemterm.py --check
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/tft_terminal_model_native.cpp -o /tmp/tft_terminal_test
          /tmp/tft_terminal_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/tft_vt100_native.cpp -o /tmp/tft_vt100_test
          /tmp/tft_vt100_test
  firmware:
    name: ESP32 headless + ST7796 ANSI terminal builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Cache ESP32 PlatformIO platform and framework
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
          key: ${{ runner.os }}-espressif32-7.1.3-framework-arduino-v1
      # Reuse the toolchain on one runner to avoid duplicate downloads.
      - name: Build headless CP/M (SPI read-ahead default ON)
        run: pio run -e esp32dev
      - name: Build ST7796 CP/M ANSI/VT100/CP437 terminal
        run: pio run -e esp32dev-tft
      - name: Reject macOS-incompatible TFT static DRAM growth
        run: python3 tests/check_esp32_dram_budget.py
      - name: Verify exact Git commit encoded in both firmware images
        run: python3 tests/check_build_revision.py
      - name: Report headless and TFT static ELF RAM
        run: |
          python3 tools/report_esp32_memory.py .pio/build/esp32dev/firmware.elf > esp32dev-memory.txt
          python3 tools/report_esp32_memory.py .pio/build/esp32dev-tft/firmware.elf > esp32dev-tft-memory.txt
          cat esp32dev-tft-memory.txt
      - name: Upload memory symbol reports
        uses: actions/upload-artifact@v4
        with:
          name: esp32-memory-reports
          path: |
            esp32dev-memory.txt
            esp32dev-tft-memory.txt
          retention-days: 30
      - name: Regression - headless CP/M (SPI read-ahead default OFF)
        run: PLATFORMIO_BUILD_FLAGS=-DEBTKS_SPI_READAHEAD_DEFAULT_ON=0 pio run -e esp32dev
