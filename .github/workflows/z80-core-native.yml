name: Z80 replacement prototype validation
on:
  push:
    branches: [main, feature/tft-vspi-bringup]
  workflow_dispatch:
jobs:
  native:
    name: Native Z80/bridge regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run host CPU tests
        run: |
          bash tests/run_z80_core_native.sh
          python3 tests/check_web_ui_cleanup.py
          python3 tests/check_tft_bringuptest.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/tft_terminal_model_native.cpp -o /tmp/tft_terminal_test
          /tmp/tft_terminal_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/tft_vt100_native.cpp -o /tmp/tft_vt100_test
          /tmp/tft_vt100_test
  firmware:
    name: ESP32 headless + ST7796 ANSI terminal builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Cache ESP32 PlatformIO platform and framework
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
          key: ${{ runner.os }}-espressif32-7.1.3-framework-arduino-v1
      # Reuse the toolchain on one runner to avoid duplicate downloads.
      - name: Build headless CP/M (SPI read-ahead default ON)
        run: pio run -e esp32dev
      - name: Build ST7796 CP/M ANSI/VT100/CP437 terminal
        run: pio run -e esp32dev-tft
      - name: Regression - headless CP/M (SPI read-ahead default OFF)
        run: PLATFORMIO_BUILD_FLAGS=-DEBTKS_SPI_READAHEAD_DEFAULT_ON=0 pio run -e esp32dev
