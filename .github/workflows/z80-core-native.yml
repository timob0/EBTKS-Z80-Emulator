name: Z80 replacement prototype validation
on:
  push:
    branches: [fix/z80-cpu-compatibility]
  workflow_dispatch:
jobs:
  native:
    name: Native Z80/bridge regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run host CPU tests
        run: |
          bash tests/run_z80_core_native.sh
          python3 tests/check_web_ui_cleanup.py
  esp32:
    name: ESP32 build (SPI default ${{ matrix.spi_default }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spi_default: [1, 0]
    env:
      PLATFORMIO_BUILD_FLAGS: -DEBTKS_SPI_READAHEAD_DEFAULT_ON=${{ matrix.spi_default }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile ESP32 firmware (do not flash)
        run: pio run -e esp32dev
