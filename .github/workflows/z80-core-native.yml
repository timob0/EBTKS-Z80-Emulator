name: Z80 replacement prototype validation
on:
  push:
    branches: [feature/tft-vspi-bringup]
  workflow_dispatch:
jobs:
  native:
    name: Native Z80/bridge regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run host CPU tests
        run: |
          bash tests/run_z80_core_native.sh
          python3 tests/check_web_ui_cleanup.py
          python3 tests/check_tft_bringuptest.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/tft_terminal_model_native.cpp -o /tmp/tft_terminal_test
          /tmp/tft_terminal_test
  esp32:
    name: ESP32 build (SPI default ${{ matrix.spi_default }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spi_default: [1, 0]
    env:
      PLATFORMIO_BUILD_FLAGS: -DEBTKS_SPI_READAHEAD_DEFAULT_ON=${{ matrix.spi_default }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile ESP32 firmware (do not flash)
        run: pio run -e esp32dev

  tft:
    name: ESP32 ST7796 opt-in build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile TFT opt-in firmware (do not flash)
        run: pio run -e esp32dev-tft

  terminal:
    name: ESP32 ST7796 CP/M terminal mirror opt-in build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile TFT terminal mirror experimental firmware (do not flash)
        run: pio run -e esp32dev-tft-terminal
