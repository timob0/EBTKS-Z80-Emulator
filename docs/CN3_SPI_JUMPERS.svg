<rect x="52" y="602" width="1096" height="62" rx="10" fill="#fff7ed" stroke="#fdba74"/>
<text x="74" y="627" font-size="17" font-weight="700" fill="#9a3412" font-family="Arial, sans-serif">Required CS pull-up: CN3-04 / ESP GPIO32 → 10 kΩ resistor → CN3-36 / 3.3 V</text>
<text x="74" y="649" font-size="14" fill="#7c2d12" font-family="Arial, sans-serif">GPIO32 is input/output capable; the installed external 10 kΩ pull-up keeps CS inactive at startup. Use a resistor; never connect CS directly to 3.3 V.</text>
<text x="52" y="699" font-size="15" font-weight="700" fill="#334155" font-family="Arial, sans-serif">CN3 PIN NUMBERS ONLY — confirm physical connector orientation and pin 1 before connecting jumpers.</text>
<text x="52" y="724" font-size="13.5" fill="#475569" font-family="Arial, sans-serif">Schematic: EBTKS V3.0 (2021-04-10), sheet 1 CN3 + Teensy U4; sheet 2 ESP32 U7. Boards already share GND.</text>
</svg>