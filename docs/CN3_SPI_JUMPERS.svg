<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<title>EBTKS V3.0 CN3 - WARNING: MISO connector contact not verified</title>
<desc>CAUTION: This historical drawing previously misstated MISO as CN3-13. CN3-13 is E04/GPIO4. GPIO17 is ESP WROOM pad28; its actual CN3 contact must be checked with power-off continuity. Other connections are historical test assignments.</desc>
<rect width="1200" height="760" fill="#f8fafc"/>
<rect x="18" y="18" width="1164" height="724" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="52" y="66" font-size="28" font-weight="700" fill="#0f172a" font-family="Arial, sans-serif">EBTKS V3.0 · CN3 SPI storage jumper plan</text>
<text x="52" y="95" font-size="15" fill="#475569" font-family="Arial, sans-serif">WARNING: MISO CN3 PIN IS UNVERIFIED · Do not wire from this diagram without continuity</text>
<rect x="52" y="115" rx="10" width="430" height="52" fill="#e0f2fe" stroke="#bae6fd"/>
<text x="267" y="137" text-anchor="middle" font-size="18" font-weight="700" fill="#075985" font-family="Arial, sans-serif">TEENSY 4.1 · SPI MASTER</text>
<text x="267" y="155" text-anchor="middle" font-size="13" fill="#075985" font-family="Arial, sans-serif">Signals on CN3, not a separate header</text>
<rect x="718" y="115" rx="10" width="430" height="52" fill="#ede9fe" stroke="#ddd6fe"/>
<text x="933" y="137" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6" font-family="Arial, sans-serif">ESP32-WROOM-32D · SPI SLAVE</text>
<text x="933" y="155" text-anchor="middle" font-size="13" fill="#5b21b6" font-family="Arial, sans-serif">GPIO-matrix pins on CN3</text>
