<marker id="arrow1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9 z" fill="#0d9488"/></marker>
<marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9 z" fill="#9333ea"/></marker>
<marker id="arrow3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9 z" fill="#ea580c"/></marker>
