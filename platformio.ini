; EBTKS Z80 Emulator - PlatformIO configuration
; Target hardware: classic ESP32-D0WD-V3 on EBTKS v3.x
;
; This mirrors the proven EBTKS ESP32 build setup while keeping the
; original Arduino sketch in ESP32_Z80_Emulator/ for Arduino IDE users.

[platformio]
src_dir = pio_src

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; main.cpp includes the original Arduino sketch from outside src_dir.  The
; default PlatformIO "chain" LDF does not reliably follow that include tree,
; which can leave Arduino framework libraries such as SPI and WiFi out of the
; compiler include path.  deep+ makes PlatformIO scan the complete sketch
; dependency tree, including framework libraries pulled in by WebServer.
lib_ldf_mode = deep+

; The upstream disk code references LED_BUILTIN as a disk activity indicator.
; EBTKS Milestone 1 has no ESP-attached SD card and these paths are never run,
; but the symbol still has to exist at compile time. GPIO2 is the conventional
; esp32dev LED definition; no pinMode or disk activity code is used on EBTKS M1.
build_flags =
    -DLED_BUILTIN=2

; Use the same async networking libraries as the rebuilt EBTKS ESP32 firmware.
lib_deps =
    ESP32Async/AsyncTCP @ 3.3.2
    ESP32Async/ESPAsyncWebServer @ 3.6.0

monitor_speed = 115200

; The ESP32 is normally updated through the EBTKS web updater, so upload_port
; is intentionally not hard-coded here. PlatformIO still produces
; .pio/build/esp32dev/firmware.bin for OTA installation.
