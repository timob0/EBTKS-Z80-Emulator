; EBTKS Z80 Emulator - PlatformIO configuration
; Target: classic ESP32-D0WD-V3 on EBTKS v3.x
; The Arduino sketch remains in ESP32_Z80_Emulator/ and is compiled through
; pio_src/main.cpp. Four independent terminal variants share one CP/M core.
;
[platformio]
src_dir = pio_src

; Default: Z80/CP/M via existing Web UI and Telnet; NO LCD, NO LovyanGFX.
[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
lib_ldf_mode = deep+
; Embed the commit ID of the actual locally/CI-compiled firmware image.
extra_scripts = pre:tools/pio_git_revision.py
lib_deps =
    ESP32Async/AsyncTCP @ 3.3.2
    ESP32Async/ESPAsyncWebServer @ 3.6.0
    bblanchon/ArduinoJson @ 7.4.2
    https://github.com/alanswx/ESPAsyncWiFiManager.git#3b9a58a031d32da908e205d60c7c58eedc8bd6ee
; Fast CRC-checked Teensy SPI read-ahead is ON by default.
; Read fallback and disk writes remain UART; /cpmmedia controls runtime mode.
; Optional compile override: -DEBTKS_SPI_READAHEAD_DEFAULT_ON=0
monitor_speed = 115200
; CPM85 HP-85 physical keyboard bridge (requires matching Teensy FIFO
; firmware and CPM85 v0.02a HP LOADBIN to attach physical keyboard).
build_flags =
    -DEBTKS_CPM85_KEYBOARD_ENABLE=1
    -DEBTKS_WEB_TERMINAL_ENABLE=1

; Full live ST7796 480x320 landscape CP/M terminal, 80x24, ANSI 16 colors,
; inverse/underline/bold intensity, VT100 editing, DEC graphics and IBM CP437.
; Same CP/M console is available concurrently via Web UI and Telnet.
; SPI3 VSPI 12 MHz experiment (8 MHz fallback), GPIO14 SCK, GPIO23 MOSI,
; GPIO13 CS, GPIO33 D/C,
; GPIO19 RESET. No TFT MISO/SD/touch, no framebuffer, no Teensy changes.
; This build is the user-verified former "esp32dev-tft-ansi" configuration.
[env:esp32dev-tft]
extends = env:esp32dev
lib_deps =
    ${env:esp32dev.lib_deps}
    lovyan03/LovyanGFX @ 1.2.7
build_flags =
    -DEBTKS_TFT_ENABLE=1
    -DEBTKS_TFT_TERMINAL_MIRROR=1
    -DEBTKS_TFT_VT100=1
    -DEBTKS_CPM85_KEYBOARD_ENABLE=1
    -DEBTKS_WEB_TERMINAL_ENABLE=1
; Fallback if the 12 MHz TFT clock causes noise on the current Dupont wiring:
;    -DEBTKS_TFT_SPI_HZ=8000000

; Physical ST7796, Web Terminal compiled OUT; /crt, /ws, Media Manager,
; diagnostics, OTA, CP/M disk services and Telnet remain available.
[env:esp32dev-tft-only]
extends = env:esp32dev-tft
build_flags =
    -DEBTKS_TFT_ENABLE=1
    -DEBTKS_TFT_TERMINAL_MIRROR=1
    -DEBTKS_TFT_VT100=1
    -DEBTKS_CPM85_KEYBOARD_ENABLE=1
    -DEBTKS_WEB_TERMINAL_ENABLE=0

; Full TFT + browser Z80 Web Terminal, but NO TCP/23 Telnet listener,
; socket, output queue, or Telnet console input parser. All Web UI,
; diagnostics, OTA, HP CRT, SD/CPM services and the CP/M Wi-Fi modem remain.
; Compare with esp32dev-tft to isolate the second (Telnet) TCP session.
[env:esp32dev-tft-no-telnet]
extends = env:esp32dev-tft
build_flags =
    -DEBTKS_TFT_ENABLE=1
    -DEBTKS_TFT_TERMINAL_MIRROR=1
    -DEBTKS_TFT_VT100=1
    -DEBTKS_CPM85_KEYBOARD_ENABLE=1
    -DEBTKS_WEB_TERMINAL_ENABLE=1
    -DEBTKS_TELNET_ENABLE=0
