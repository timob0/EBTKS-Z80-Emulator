; EBTKS Z80 Emulator - PlatformIO configuration
; Target hardware: classic ESP32-D0WD-V3 on EBTKS v3.x
;
; This mirrors the proven EBTKS ESP32 build setup while keeping the
; original Arduino sketch in ESP32_Z80_Emulator/ for Arduino IDE users.

[platformio]
src_dir = pio_src

[env:esp32dev]
; Keep Arduino-ESP32 2.x used by hardware-tested firmware. Unpinned
; espressif32 resolved to 8.0.0 on 2026-10-19 (Arduino-ESP32 3.3.12),
; incompatible with the pinned networking stack (missing Network.h).
; Last successful validated firmware and SPI-on/off CI used 7.1.3.
platform = espressif32@7.1.3
board = esp32dev
framework = arduino

; main.cpp includes the original Arduino sketch from outside src_dir. The
; default PlatformIO "chain" LDF does not reliably follow that include tree,
; which can leave Arduino framework libraries out of the compiler include path.
lib_ldf_mode = deep+

; Async networking plus the same WiFiManager fork/revision used by the
; rebuilt EBTKS ESP32 firmware. ArduinoJson is used by the Milestone 2
; Teensy-backed storage protocol client.
lib_deps =
    ESP32Async/AsyncTCP @ 3.3.2
    ESP32Async/ESPAsyncWebServer @ 3.6.0
    bblanchon/ArduinoJson @ 7.4.2
    https://github.com/alanswx/ESPAsyncWiFiManager.git#3b9a58a031d32da908e205d60c7c58eedc8bd6ee

; CRC-checked CP/M disk read-ahead defaults ON after the system has started.
; To keep UART as the startup read transport, uncomment the line below.
; Read fallback and ALL writes always remain UART; runtime mode control remains
; available at /cpmmedia regardless of this startup policy.
; build_flags = -DEBTKS_SPI_READAHEAD_DEFAULT_ON=0

monitor_speed = 115200

; The ESP32 is normally updated through the EBTKS web updater, so upload_port
; is intentionally not hard-coded here. PlatformIO still produces
; .pio/build/esp32dev/firmware.bin for OTA installation.

; Experimental ST7796 hardware bring-up image. Normal esp32dev remains
; byte-for-byte identical at the source/preprocessor level (TFT disabled).
; Build with "pio run -e esp32dev-tft"; its OTA image will be at
; .pio/build/esp32dev-tft/firmware.bin. The display is driven ONCE at boot.
; GPIO SCK14, MOSI23, CS13, DC33, RST19 must be verified on the actual PCB.
;
; LovyanGFX 1.2.7 has its own config in ebtks_tft_test.h: SPI3/VSPI master,
; mode 0, 4 MHz, no MISO, touch, onboard SD, backlight PWM, or framebuffer.
;
[env:esp32dev-tft]
extends = env:esp32dev
lib_deps =
    ${env:esp32dev.lib_deps}
    lovyan03/LovyanGFX @ 1.2.7
build_flags = -DEBTKS_TFT_ENABLE=1

; Console mirror experiment: keeps the hardware-verified TFT color-bar
; environment separate and uses the same library/controller. 80x24 compact
; character model with basic HP/Soroc and ANSI controls. No full framebuffer.
[env:esp32dev-tft-terminal]
extends = env:esp32dev-tft
build_flags = -DEBTKS_TFT_ENABLE=1 -DEBTKS_TFT_TERMINAL_MIRROR=1

; Second-generation VT100/ANSI + CP437 implementation. Preserve the
; already user-tested 80x24 terminal target as a separate rollback build.
[env:esp32dev-tft-ansi]
extends = env:esp32dev-tft-terminal
build_flags = -DEBTKS_TFT_ENABLE=1 -DEBTKS_TFT_TERMINAL_MIRROR=1 -DEBTKS_TFT_VT100=1
