; EBTKS Z80 Emulator — two supported PlatformIO targets.
; Both include CP/M, browser Z80 terminal, Wi-Fi modem, Media Manager,
; HP-80 CRT, OTA, SPI disk and HP keyboard; neither enables Telnet by default.
; Advanced users may enable Telnet on EITHER target by adding
; -DEBTKS_TELNET_ENABLE=1 to that environment's build_flags.
; Only env:esp32dev-tft uses LovyanGFX/ST7796.
[platformio]
src_dir = pio_src

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
lib_ldf_mode = deep+
extra_scripts =
    pre:tools/pio_git_revision.py
    pre:tools/pio_gzip_pages.py
lib_deps =
    ESP32Async/AsyncTCP @ 3.3.2
    ESP32Async/ESPAsyncWebServer @ 3.6.0
    bblanchon/ArduinoJson @ 7.4.2
    https://github.com/alanswx/ESPAsyncWiFiManager.git#3b9a58a031d32da908e205d60c7c58eedc8bd6ee
monitor_speed = 115200
; Full, headless bundle. Preserve the hardware-accepted early IRAM32-only
; 8 KiB SPI cache for both configurations; UART read fallback remains safe.
; Telnet defaults OFF in ebtks_firmware_options.h, not in a build flag,
; allowing -DEBTKS_TELNET_ENABLE=1 without conflicting definitions.
build_flags =
    -DEBTKS_CPM85_KEYBOARD_ENABLE=1
    -DEBTKS_WEB_TERMINAL_ENABLE=1
    -DEBTKS_SPI_CACHE_EARLY_IRAM_ONLY=1

; Same complete bundle plus ST7796 SPI output: landscape 480x320, 80x24,
; 16 ANSI colors, VT100/CP437, dirty-row TFT rendering. No framebuffer.
; GPIO14 SCK, GPIO23 MOSI, GPIO13 CS, GPIO33 D/C, GPIO19 RESET.
; No TFT MISO/SD/touch, no Teensy changes. Default Telnet is OFF.
[env:esp32dev-tft]
extends = env:esp32dev
lib_deps =
    ${env:esp32dev.lib_deps}
    lovyan03/LovyanGFX @ 1.2.7
build_flags =
    ${env:esp32dev.build_flags}
    -DEBTKS_TFT_ENABLE=1
    -DEBTKS_TFT_TERMINAL_MIRROR=1
    -DEBTKS_TFT_VT100=1
; If the TFT wiring needs a lower SPI clock, add to TFT build_flags:
;    -DEBTKS_TFT_SPI_HZ=8000000
